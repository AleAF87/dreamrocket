<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente cobre rose-gold idêntico ao do símbolo oficial da Aurea -->
    <linearGradient id="aurea-copper-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE99" />
      <stop offset="45%" stop-color="#D7A47B" />
      <stop offset="75%" stop-color="#BA7E55" />
      <stop offset="100%" stop-color="#9C5E35" />
    </linearGradient>
    <linearGradient id="aurea-copper-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7A47B" />
      <stop offset="50%" stop-color="#A86E45" />
      <stop offset="100%" stop-color="#7B4722" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro sutil com borda fina premium -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#BA7E55" stroke-opacity="0.35" stroke-width="1" />

  <!-- Símbolo da Aurea Engenharia Consultiva (Setas ascendentes / Torres arquitetônicas em Cobre) -->
  <g id="aurea-symbol" transform="translate(14, 8) scale(0.56)">
    <!-- Asa / Torre Esquerda -->
    <!-- Coluna central esquerda com ponta chanfrada em seta -->
    <path d="M 28 0 L 10 17 L 18 17 L 18 52 L 28 52 Z" fill="url(#aurea-copper-light)" />
    <!-- Coluna exterior esquerda com topo em telhado e pé inclinado -->
    <path d="M 8 20 L 0 28 L 5 28 L 5 62 L 0 74 L 10 74 L 10 24 Z" fill="url(#aurea-copper-dark)" />

    <!-- Asa / Torre Direita -->
    <!-- Coluna central direita com ponta chanfrada em seta -->
    <path d="M 36 0 L 54 17 L 46 17 L 46 52 L 36 52 Z" fill="url(#aurea-copper-light)" />
    <!-- Coluna exterior direita com topo em telhado e pé inclinado -->
    <path d="M 56 20 L 64 28 L 59 28 L 59 62 L 64 74 L 54 74 L 54 24 Z" fill="url(#aurea-copper-dark)" />
  </g>
</svg>