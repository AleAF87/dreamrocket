<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve assets before loading the bundle, including nested Netlify routes
      // and Live Server URLs whose root is above the project directory.
      const pageMount = location.pathname.match(/^(.*\/pagina_dev\/aurea_engenharia)(?:\/|$)/)
      const pageDirectory = pageMount
        ? pageMount[1] + '/'
        : new URL('.', location.href).pathname
      const pageBase = document.createElement('base')
      pageBase.href = location.origin + pageDirectory
      if (location.pathname === pageDirectory + 'index.html') {
        pageBase.href += 'index.html'
      }
      document.head.appendChild(pageBase)
    </script>
    <title>AUREA Engenharia Consultiva | Regularização de Edificações e AVCB</title>
    <meta name="description" content="AUREA Engenharia Consultiva — Engenharia que sustenta decisões. Regularização de edificações, projetos de combate a incêndio e AVCB em São Paulo." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
